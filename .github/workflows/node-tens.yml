name: 'Tests: node.js >= 10'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: 'node ${{ matrix.node-version }}'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [21, 20, 18]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 'pin the npm registry to the release-date time machine'
        run: npm config set registry https://:2024-04-12T22%3A24%3A25.107Z@time-machines-npm.sealsecurity.io/
      - name: 'npm install'
        run: npm install
      - name: 'tests'
        run: npm run tests-only

  pack:
    name: 'pack the release tarball'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 21
      - name: 'pin the npm registry to the release-date time machine'
        run: npm config set registry https://:2024-04-12T22%3A24%3A25.107Z@time-machines-npm.sealsecurity.io/
      - name: 'npm install'
        run: npm install
      - name: 'npm pack (prepack regenerates dist/qs.js and applies publishConfig.ignore)'
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: qs-tarball
          path: qs-6.12.1.tgz
          if-no-files-found: error

  node:
    name: 'node >= 10'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: 'echo tests completed'
